name: Vercel E2E Preview
on: [pull_request]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  e2e-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # ✅ 保持子目录配置不变
    defaults:
      run:
        working-directory: ./webapp

    steps:
      - uses: actions/checkout@v4

      # 🔄 修改点 1: 建立 Bun 环境
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          # 可选：如果你的 bun.lockb 在根目录，这里不用改；
          # 如果在 webapp 下，setup-bun 通常能自动识别，或需手动指定 cache
          
      # 🔄 修改点 2: 使用 Bun 安装依赖
      # --frozen-lockfile 相当于 npm ci，确保不修改 lock 文件
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 🔄 修改点 3: 使用 Bunx 安装 Playwright 浏览器
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      # Vercel 这一步保持不变 (它是独立的 Action)
      - name: Wait for Vercel Preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        id: waitForVercel
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300

      # 🔄 修改点 4: 使用 Bunx 运行测试
      - name: Run Playwright tests
        run: bunx playwright test
        env:
          BASE_URL: ${{ steps.waitForVercel.outputs.url }}
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: webapp/playwright-report/
          retention-days: 30