name: Tests
on: [pull_request]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun run test:coverage
        env:
          DIFY_API_ENDPOINT: https://api.dify.ai/v1
          DIFY_API_KEY: test-api-key
          DIFY_ENV: test
          FEEDBACK_MAX_LENGTH: 5000

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./webapp/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  e2e-tests:
    name: E2E Tests (Local)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          BASE_URL: http://localhost:3000
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_API_ENDPOINT: ${{ secrets.DIFY_API_ENDPOINT }}
          DIFY_ENV: stage

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-local
          path: webapp/playwright-report/
          retention-days: 30

  e2e-preview-tests:
    name: E2E Tests (Vercel Preview)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./webapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Wait for Vercel Preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        id: waitForVercel
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300

      - name: Run E2E tests on Preview
        run: bunx playwright test
        env:
          BASE_URL: ${{ steps.waitForVercel.outputs.url }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_API_ENDPOINT: ${{ secrets.DIFY_API_ENDPOINT }}
          DIFY_ENV: stage
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-preview
          path: webapp/playwright-report/
          retention-days: 30

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ E2E tests on Vercel Preview completed! Check the artifacts for detailed report.'
            });

  integration-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    environment: preview
    defaults:
      run:
        working-directory: ./webapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Wait for Vercel Preview Deployment
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        id: waitForDeployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300

      - name: Run API Integration tests
        run: bun run test:e2e -- api-integration.spec.ts
        env:
          BASE_URL: ${{ steps.waitForDeployment.outputs.url }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_API_ENDPOINT: ${{ secrets.DIFY_API_ENDPOINT }}
          DIFY_ENV: stage
          RUN_INTEGRATION_TESTS: true

      - name: Upload Integration test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-report
          path: webapp/playwright-report/
          retention-days: 30

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = './webapp/playwright-report/index.html';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ API Integration tests completed! Check the artifacts for detailed report.'
            });
